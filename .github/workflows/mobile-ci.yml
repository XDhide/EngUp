name: Mobile CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'Mobile/**'
  push:
    branches: [dev, main]
    paths:
      - 'Mobile/**'

jobs:
  check:
    name: Kiểm tra Mobile (type-check + lint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Mobile/package-lock.json

      - name: Cài dependencies
        run: npm ci

      - name: Tạo expo-env.d.ts nếu chưa tồn tại (cần cho tsc trong CI)
        run: |
          if [ ! -f expo-env.d.ts ]; then
            echo '/// <reference types="expo/types/global" />' > expo-env.d.ts
          fi

      - name: Kiểm tra lỗi biên dịch TypeScript (type-check, không build ra file)
        run: npx tsc --noEmit

      - name: Kiểm tra lỗi logic/style bằng ESLint (expo lint)
        run: npm run lint
