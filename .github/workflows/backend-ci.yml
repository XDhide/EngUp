name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'Backend/**'
  push:
    branches: [dev, main]
    paths:
      - 'Backend/**'

jobs:
  check:
    name: Kiểm tra Backend (cài đặt + biên dịch)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Cài dependencies (fail nếu package-lock lỗi/không khớp)
        run: npm ci

      - name: Kiểm tra lỗi biên dịch (syntax check toàn bộ file .js)
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Kiểm tra ESLint (nếu đã cấu hình)
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f eslint.config.js ]; then
            npx eslint src --max-warnings=0
          else
            echo "Chưa cấu hình ESLint - bỏ qua bước này. Khuyến nghị thêm ESLint để bắt lỗi logic tốt hơn."
          fi
